name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o "$(ls *.zip | head -1)" -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: work/CarCamMediator
        run: gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      - name: Show compile errors
        if: always()
        run: |
          echo '### أخطاء الترجمة' >> $GITHUB_STEP_SUMMARY
          grep -E '^e: ' work/build.log | sed 's|file:///home/runner/work/[^/]*/[^/]*/work/CarCamMediator/||' | head -40 >> $GITHUB_STEP_SUMMARY || true
          grep -E '^e: ' work/build.log | sed 's|file:///home/runner/work/[^/]*/[^/]*/work/CarCamMediator/||' | head -40 || true
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: CarCam-debug-apk
          path: work/CarCamMediator/app/build/outputs/apk/debug/*.apk
